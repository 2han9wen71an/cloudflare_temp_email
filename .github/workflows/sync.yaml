
name: Upstream Sync

on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

# The built-in GITHUB_TOKEN does not need write access.
permissions: {}

concurrency:
  group: upstream-sync-main
  cancel-in-progress: false

jobs:
  sync_latest_from_upstream:
    name: Sync latest commits from upstream repo
    runs-on: ubuntu-latest
    if: ${{ github.event.repository.fork }}

    steps:
      - name: Sync upstream changes
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
        run: |
          set -euo pipefail
          gh repo sync "$GITHUB_REPOSITORY" \
            --source dreamhunter2333/cloudflare_temp_email \
            --branch main
